<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InkDOS Office · update</title>
</head>
<body style="font:16px -apple-system,BlinkMacSystemFont,sans-serif;padding:24px">
<p>Updating… / Atualizando…</p>
<script>
// Check for updates lands here. This page is never cached (scripts/cloudflare_prepare.py); the browser keeps the rest
// of the site for a year. Clear-Site-Data is not honoured by every web view (XeOS), so the Home and every file it
// loads are fetched again past the cache (cache: 'reload' stores the new copy), then the Home opens with ?warm=1.
(function () {
  var done = false;
  function back() { if (!done) { done = true; location.replace('./?warm=1'); } }
  setTimeout(back, 20000);
  function again(url) { return fetch(url, { cache: 'reload' }).then(function (r) { return r.text(); }).catch(function () { return ''; }); }
  Promise.all([again('./'), again('./index.html')]).then(function (pages) {
    var html = pages[0] || pages[1] || '', urls = [];
    html.replace(/(?:src|href)="(\.?\/[^"#]+)"/g, function (_, u) { if (!/^\/\//.test(u)) urls.push(new URL(u, location.href).href); return _; });
    urls.push(new URL('./update.html', location.href).href.replace('update.html', 'inkdos-apps.json'));
    return Promise.all(urls.map(again));
  }).then(back, back);
})();
</script>
</body>
</html>
