<!doctype html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="connect-src 'self' data: blob:; frame-src 'self' blob: https://vfydr2m9wk-ops.github.io; form-action 'none'; object-src 'none'; base-uri 'self'" data-inkdos-office>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>InkDOS Office</title>
  <link rel="icon" href="./assets/icons/office.svg">
  <link rel="apple-touch-icon" href="./assets/icons/office.png">
  <script src="./office-home-theme.js"></script>
  <link rel="stylesheet" href="./assets/home.css">
  <link rel="stylesheet" href="./shared/ui-density.css">
  <link rel="stylesheet" href="./office-home.css">
  <script src="./shared/ui-density.js"></script>
  <script src="./shared/localization/ui-localization.js"></script>
  <script src="./shared/localization/home-settings.js"></script>
  <script src="./open-local.js" defer></script>
  <script src="./office-home.js" defer></script>
  <script src="./office-offline.js" defer></script>
</head>
<body>
  <main class="home-shell" data-inkdos-i18n-root>
    <header class="brand-row">
      <a class="brand" href="./" aria-current="page" aria-label="InkDOS Office">
        <span class="brand-mark" aria-hidden="true"><img src="./assets/icons/office.svg" alt=""></span>
        <span class="brand-copy"><strong>InkDOS Office</strong><small>Local-first workspace</small></span>
      </a>
      <span class="home-actions"><button id="offlineToolsButton" class="theme-button" type="button" aria-label="Offline tools" title="Offline tools" aria-haspopup="dialog" aria-controls="offlineTools" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 19h14"/></svg></button>
      <div class="home-appearance">
        <button id="appearanceButton" class="theme-button" type="button" aria-label="Settings" title="Settings" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
        </button>
        <div id="appearanceMenu" class="theme-menu" role="menu" aria-label="Settings" hidden>
          <button type="button" role="menuitemradio" data-home-appearance-mode="light" aria-checked="false">Light</button>
          <button type="button" role="menuitemradio" data-home-appearance-mode="dark" aria-checked="false">Dark</button>
          <button type="button" role="menuitemradio" data-home-appearance-mode="system" aria-checked="false">System</button>
        </div>
      </div></span>
    </header>

    <section class="intro" aria-labelledby="workspaceTitle"><h1 id="workspaceTitle">Choose a workspace</h1>
    </section>




    <footer class="home-footer office-footer">
      <span class="powered"><span data-office-t="powered">Powered by</span> <img src="./web-apps/apps/common/main/resources/img/about/logo_s.svg" alt="ONLYOFFICE"></span>
      <nav aria-label="Project links"><a href="https://github.com/vfydr2m9wk-ops/InkDOS" data-office-t="source">Source</a></nav>
    </footer>
  </main>
  <div id="offlineTools" class="offline-overlay" hidden>
    <section class="offline-panel" role="dialog" aria-modal="true" aria-labelledby="offlineTitle">
      <header class="offline-head"><h2 id="offlineTitle" data-office-t="offlineTitle">Tools on this device</h2><button type="button" class="office-action" data-offline-close data-office-t="close">Close</button></header>
      <p class="offline-intro" data-office-t="offlineIntro">Download the tools once and they open with no internet. Files you open never leave this device.</p>
      <ul class="offline-list" data-offline-list></ul>
      <p class="offline-warn" data-offline-warn hidden></p>
      <footer class="offline-foot"><small data-offline-usage></small><span class="offline-actions"><button type="button" class="office-action" data-offline-update data-office-t="checkUpdates">Check for updates</button><button type="button" class="office-action primary" data-offline-all data-office-t="downloadAll">Download all</button></span></footer>
    </section>
  </div>
</body>
</html>
