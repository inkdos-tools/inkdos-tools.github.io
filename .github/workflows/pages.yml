name: Build and deploy the full office suite (beta)

# The source (this branch) builds ranuts/document at the commit pinned in office.json and publishes the
# result to the main branch, which GitHub Pages serves at https://inkdos-tools.github.io/ (an organization
# site publishes its default branch).
on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build
        run: python build.py --out _site
      - name: Publish to the main branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: main
          force_orphan: true  # one commit per deploy, so old builds do not pile up in history
          commit_message: Deploy full office suite (beta)
